name: twitter-clone-development

# Activate with COMPOSE_PROFILES=dev (set in .env) or `docker compose --profile dev …`.
# Production uses compose.prod.yaml with COMPOSE_PROFILES=prod.

services:
  postgres:
    profiles: ["dev", "prod"]
    image: postgres:17.7-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data

  api:
    profiles: ["dev"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: development
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 4000
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      CORS_ORIGIN: ${CORS_ORIGIN}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      NODE_ENV: development
      SESSION_SECRET: ${SESSION_SECRET}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-604800}
      UPLOADS_ENABLED: ${UPLOADS_ENABLED:-false}
      MEDIA_STORAGE_DIR: /var/lib/twitter-clone/media
      PUBLIC_API_ORIGIN: ${PUBLIC_API_ORIGIN:-http://localhost:4000}
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/health/live').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 20
    init: true
    ports:
      - "127.0.0.1:${API_PORT:-4000}:4000"
    volumes:
      - .:/workspace
      - workspace-node-modules:/workspace/node_modules
      - media-data:/var/lib/twitter-clone/media

  web:
    profiles: ["dev"]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: development
    depends_on:
      api:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      NEXT_PUBLIC_UPLOADS_ENABLED: ${NEXT_PUBLIC_UPLOADS_ENABLED:-false}
    init: true
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    volumes:
      - .:/workspace
      - workspace-node-modules:/workspace/node_modules
      # The container's Next.js cache stays out of the host's apps/web/.next;
      # two `next dev` processes sharing one Turbopack cache corrupt it.
      - web-next:/workspace/apps/web/.next

  # DEV-01 local activity simulator. Off by default: setup starts it only when
  # ACTIVITY_SIMULATOR=true. Stop: pnpm activity:stop. Undo: pnpm activity:reset.
  activity:
    profiles: ["activity"]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: development
    command: ["pnpm", "--filter", "@twitter-clone/api", "activity"]
    depends_on:
      api:
        condition: service_healthy
    environment:
      ACTIVITY_API_URL: http://api:4000
      ACTIVITY_INTERVAL_SECONDS: ${ACTIVITY_INTERVAL_SECONDS:-30}
      ACTIVITY_SIMULATOR: ${ACTIVITY_SIMULATOR:-false}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      NODE_ENV: development
    init: true
    restart: "no"
    volumes:
      - .:/workspace
      - workspace-node-modules:/workspace/node_modules

volumes:
  postgres-data:
  media-data:
  web-next:
  workspace-node-modules:
